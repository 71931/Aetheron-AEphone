<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aetheron 黑白桌面 · AEphone</title>
<style>html,body{margin:0;height:100%;background:#000}</style>
<script>
/* 固定入口：链接永不改变；每次打开都去取最新版本号，再进入对应版本目录。
   version.json 用 cache-buster + no-store 拉取，保证不吃 CDN 缓存。 */
(function () {
  var FALLBACK = "20260910-114848";
  function go(build) {
    try { location.replace('./v/' + build + '/'); }
    catch (e) { location.href = './v/' + build + '/'; }
  }
  try {
    if (window.fetch) {
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { go((j && j.build) || FALLBACK); })
        .catch(function () { go(FALLBACK); });
    } else {
      var x = new XMLHttpRequest();
      x.open('GET', 'version.json?t=' + Date.now(), true);
      x.onload = function () {
        var b = FALLBACK;
        try { b = JSON.parse(x.responseText).build || FALLBACK; } catch (e) {}
        go(b);
      };
      x.onerror = function () { go(FALLBACK); };
      x.send(null);
    }
  } catch (e) { go(FALLBACK); }
})();
</script>
</head>
<body></body>
</html>
